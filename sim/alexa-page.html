<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iris-alexa — simulated page</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; min-height: 5rem; font: inherit; padding: .5rem; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
  button { font: inherit; padding: .5rem .9rem; cursor: pointer; }
  #spoken { border-left: 4px solid #888; padding: .75rem 1rem; margin-top: 1rem; min-height: 3rem; white-space: pre-wrap; }
  #raw { font-size: .8rem; opacity: .7; white-space: pre-wrap; word-break: break-all; }
  small { opacity: .7; }
</style>
</head>
<body>
<h1>iris-alexa — simulated page</h1>
<p><small>A stand-in for an MCP host. It posts the same JSON-RPC an MCP host sends to <code>/mcp</code> and reads the text back. Read-only. Nothing is stored. Do not type a seed phrase.</small></p>

<textarea id="input" placeholder="Paste a message, a link, or a public Solana signature"></textarea>
<div class="row">
  <button data-tool="check_scam" data-arg="situation">check_scam</button>
  <button data-tool="check_link" data-arg="url">check_link</button>
  <button data-tool="explain_transaction" data-arg="signature">explain_transaction</button>
  <button data-tool="safety_tip" data-arg="topic">safety_tip</button>
  <button data-tool="clean_up_steps" data-arg="target">clean_up_steps</button>
  <label><input type="checkbox" id="speak"> speak it</label>
</div>

<div id="spoken">…</div>
<details><summary>raw result</summary><pre id="raw"></pre></details>

<script>
  const spoken = document.getElementById("spoken");
  const raw = document.getElementById("raw");
  const input = document.getElementById("input");
  let id = 1;

  async function rpc(method, params) {
    const response = await fetch("/mcp", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "accept": "application/json, text/event-stream",
        "mcp-protocol-version": "2025-11-25",
      },
      body: JSON.stringify({ jsonrpc: "2.0", id: id++, method, params }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    // Streamable HTTP may return SSE (event/data) even for a JSON result body.
    if (/^\s*event:/i.test(text)) {
      const dataLine = text.split(/\r?\n/).find((line) => line.startsWith("data:"));
      if (!dataLine) throw new Error("SSE response had no data line");
      return JSON.parse(dataLine.slice(5).trim());
    }
    return JSON.parse(text);
  }

  function toSpeech(payload) {
    if (payload.summary) return payload.summary;
    if (payload.refused) return payload.warning;
    if (payload.tip) return payload.tip;
    if (payload.steps) return payload.steps.join(" ");
    if (payload.found === false) return payload.message;
    if (payload.found === true) return `${payload.class_label}. ${payload.findings.join(" ")} ${payload.note}`;
    const lead = payload.verdict === "scam" ? "Stop. This matches a scam pattern." : payload.verdict === "official" ? "That is an official domain." : payload.verdict === "unclear" ? "I can't check that." : "No known pattern.";
    return `${lead} ${payload.why} ${(payload.next_steps || []).join(" ")}`;
  }

  for (const button of document.querySelectorAll("button[data-tool]")) {
    button.addEventListener("click", async () => {
      const tool = button.dataset.tool;
      const value = input.value.trim();
      const args = {};
      if (tool === "safety_tip") { if (value) args.topic = value; }
      else if (tool === "clean_up_steps") args.target = value || "wallet";
      else args[button.dataset.arg] = value;
      spoken.textContent = "…";
      try {
        const reply = await rpc("tools/call", { name: tool, arguments: args });
        raw.textContent = JSON.stringify(reply, null, 2);
        const text = reply.result && reply.result.content && reply.result.content[0] ? reply.result.content[0].text : JSON.stringify(reply.error);
        let payload;
        try { payload = JSON.parse(text); } catch { payload = { why: text }; }
        const line = toSpeech(payload);
        spoken.textContent = line;
        if (document.getElementById("speak").checked && "speechSynthesis" in window) {
          speechSynthesis.cancel();
          speechSynthesis.speak(new SpeechSynthesisUtterance(line));
        }
      } catch (error) {
        spoken.textContent = String(error && error.message ? error.message : error);
      }
    });
  }
</script>
</body>
</html>
